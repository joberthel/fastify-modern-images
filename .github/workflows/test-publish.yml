name: Test and Publish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run pinact check
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          fix: 'false'

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: 3.13
      # - run: pip install "rembg[cli]"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate conventional commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec commitlint --from="${{ github.event.pull_request.base.sha }}" --to="${{ github.event.pull_request.head.sha }}"
          else
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              pnpm exec commitlint --from="HEAD~1" --to="HEAD"
            else
              pnpm exec commitlint --last
            fi
          fi

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1

